# ============================================================
#  EINSTELLUNGEN für dein Morning Briefing
#  Diese Datei kannst du mit dem Editor (Notepad) bearbeiten.
#  Nach dem Speichern: App-Fenster schliessen und start.bat neu starten.
#
#  Regeln:
#  - Text steht immer in "Anführungszeichen".
#  - Zeilen mit # am Anfang sind Kommentare und werden ignoriert.
#  - Jeder Eintrag beginnt mit [[...]] in einer eigenen Zeile.
# ============================================================

[app]
port = 8765              # interne Adresse der App, nur ändern, wenn es Probleme gibt
news_pro_quelle = 10     # wie viele Schlagzeilen pro Quelle geladen werden


# ------------------------------------------------------------
#  1. MÄRKTE AUF EINEN BLICK
#  symbol = Kürzel bei Yahoo Finance (finance.yahoo.com)
# ------------------------------------------------------------
[[maerkte]]
name = "SMI"
symbol = "^SSMI"

[[maerkte]]
name = "DAX"
symbol = "^GDAXI"

[[maerkte]]
name = "Euro Stoxx 50"
symbol = "^STOXX50E"

[[maerkte]]
name = "S&P 500"
symbol = "^GSPC"

[[maerkte]]
name = "Nasdaq"
symbol = "^IXIC"

[[maerkte]]
name = "Nikkei 225"
symbol = "^N225"


# ------------------------------------------------------------
#  2. DEVISEN UND ROHSTOFFE
#  dezimalen = Anzahl Nachkommastellen in der Anzeige
# ------------------------------------------------------------
[[devisen_rohstoffe]]
name = "EUR/CHF"
symbol = "EURCHF=X"
dezimalen = 4

[[devisen_rohstoffe]]
name = "USD/CHF"
symbol = "CHF=X"
dezimalen = 4

[[devisen_rohstoffe]]
name = "Gold"
symbol = "GC=F"
einheit = "USD/Unze"

[[devisen_rohstoffe]]
name = "Brent-Öl"
symbol = "BZ=F"
einheit = "USD/Fass"

[[devisen_rohstoffe]]
name = "Bitcoin"
symbol = "BTC-USD"
einheit = "USD"
dezimalen = 0


# ------------------------------------------------------------
#  3. ZINSEN (Rendite 10-jährige Staatsanleihen)
#  quelle = "snb", "bundesbank" oder "yahoo" (dann mit symbol)
#  Diese Einträge musst du normalerweise nicht ändern.
# ------------------------------------------------------------
[[zinsen]]
name = "Schweiz"
quelle = "snb"

[[zinsen]]
name = "Deutschland"
quelle = "bundesbank"

[[zinsen]]
name = "USA"
quelle = "yahoo"
symbol = "^TNX"


# ------------------------------------------------------------
#  4. MEINE WATCHLIST
#  Schweizer Aktien enden bei Yahoo auf .SW
#  Kürzel findest du auf finance.yahoo.com (in Klammern beim Titel)
# ------------------------------------------------------------
[[watchlist]]
name = "Nestlé"
symbol = "NESN.SW"
einheit = "CHF"

[[watchlist]]
name = "Novartis"
symbol = "NOVN.SW"
einheit = "CHF"

[[watchlist]]
name = "Roche GS"
symbol = "ROP.SW"
einheit = "CHF"

[[watchlist]]
name = "UBS"
symbol = "UBSG.SW"
einheit = "CHF"


# ------------------------------------------------------------
#  5. NEWS (RSS-Feeds)
#  gruppe   = "Schweiz" oder "International" (für die Filter)
#  sprache  = "en" bei englischen Quellen (zeigt ein kleines EN)
# ------------------------------------------------------------
[[news]]
name = "NZZ Wirtschaft"
url = "https://www.nzz.ch/wirtschaft.rss"
gruppe = "Schweiz"

[[news]]
name = "SRF Wirtschaft"
url = "https://www.srf.ch/news/bnf/rss/1926"
gruppe = "Schweiz"

[[news]]
name = "finews.ch"
url = "https://www.finews.ch/news?format=feed&type=rss"
gruppe = "Schweiz"

[[news]]
name = "CNBC"
url = "https://www.cnbc.com/id/100003114/device/rss/rss.html"
gruppe = "International"
sprache = "en"
